<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>PNG Color to Grayscale</title>
    <link rel="stylesheet" href="asset/style.css">
</head>
<body>
<header>
    <h1>PNG Color to Grayscale</h1>
    <p>GitHub：
        <a href="https://github.com/kakoikeisuke/png-color-to-grayscale">
            https://github.com/kakoikeisuke/png-color-to-grayscale
        </a>
    </p>
</header>
<main>
    <input type="file" id="input-file" accept="image/png" class="hide-content">
    <img src="asset/svg/input.svg" alt="input color png image" id="input-view">
    <div>
        <div>
            <p>変換の際に使用するチャンネル</p>
            <input type="radio" id="rgb-channel" name="channel" value="rgb-channel" checked>
            <label for="rgb-channel">RGB</label>
            <input type="radio" id="r-channel" name="channel" value="r-channel">
            <label for="r-channel">R</label>
            <input type="radio" id="g-channel" name="channel" value="g-channel">
            <label for="g-channel">G</label>
            <input type="radio" id="b-channel" name="channel" value="b-channel">
            <label for="b-channel">B</label>
            <input type="radio" id="a-channel" name="channel" value="a-channel">
            <label for="a-channel">アルファ</label>
        </div>
        <div>
            <input type="radio" id="bit-8" name="bit" value="bit-8" checked>
            <label for="bit-8">8 bit</label>
            <input type="radio" id="bit-16" name="bit" value="bit-16">
            <label for="bit-16">16 bit</label>
        </div>
        <div>
            <input type="checkbox" id="weighted" name="method" value="weighted">
            <label for="weighted">加重平均</label>
        </div>
        <div>
            <input type="number" id="r-weight" name="r-weight" value="1">
            <label for="r-weight"></label>
            <input type="number" id="g-weight" name="g-weight" value="1">
            <label for="g-weight"></label>
            <input type="number" id="b-weight" name="b-weight" value="1">
            <label for="b-weight"></label>
        </div>
        <div>
            <input type="checkbox" id="invert" name="invert">
            <label for="invert">反転</label>
        </div>
    </div>
    <img src="asset/svg/output.svg" alt="output grayscale png image">
</main>
<script src="asset/wasm_exec.js"></script>
<script src="asset/script.js"></script>
</body>
</html>
